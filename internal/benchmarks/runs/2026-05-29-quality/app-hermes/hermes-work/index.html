<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantry Pulse</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="header-row">
        <h1>Pantry Pulse</h1>
        <span class="count-badge" id="countBadge" aria-live="polite">7 items</span>
      </div>
      <p class="subtitle">Know what's on hand before you shop.</p>
    </header>

    <div class="filters" role="group" aria-label="Filter pantry items">
      <button class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
      <button class="filter-btn" data-filter="expiring" aria-pressed="false">Expiring soon</button>
    </div>

    <ul class="pantry-list" id="pantryList" role="list" aria-label="Pantry items"></ul>

    <footer class="app-footer">
      <p>Pantry Pulse &mdash; keep your kitchen honest.</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
