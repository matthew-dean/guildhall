abstractions:
  - id: button
    title: Command buttons
    kind: ui-component
    canonicalPath: src/web/lib/Button.svelte
    useWhen:
      - A user triggers an action from a toolbar, form, panel, drawer, or wizard.
    avoid:
      - Do not add local button padding, radius, neutral backgrounds, or one-off action styles.
    related:
      - src/web/lib/StatusButton.svelte
      - packages/ui/src/styles.css
  - id: status-button
    title: Status and attention buttons
    kind: ui-component
    canonicalPath: src/web/lib/StatusButton.svelte
    useWhen:
      - A topbar or compact control needs an outlined status treatment with optional badge count.
    avoid:
      - Do not build bespoke badge/button combinations in individual surfaces.
    related:
      - src/web/lib/Button.svelte
  - id: frame-card
    title: Framed content cards
    kind: ui-component
    canonicalPath: packages/ui/src/components/FrameCard.svelte
    useWhen:
      - A settings or dashboard section needs a framed group with a shared header pattern.
    avoid:
      - Do not nest decorative cards inside cards or invent local panel chrome.
    related:
      - packages/ui/src/components/SectionHeader.svelte
  - id: settings-select
    title: Settings select controls
    kind: ui-component
    canonicalPath: src/web/lib/Select.svelte
    useWhen:
      - A settings row chooses one value from an enum or inherited default.
    avoid:
      - Do not render enum choices as inert individual buttons.
    related:
      - src/web/surfaces/project/SettingsTab.svelte
  - id: design-system
    title: Design system tokens and primitives
    kind: design-system
    canonicalPath: .guildhall/design-system.yaml
    useWhen:
      - A UI change introduces color, spacing, typography, radius, shadow, copy voice, accessibility, or reusable
        component behavior.
      - "Use just-in-time systemization: extend shared tokens or primitives when repetition is stable or the same UI
        idea appears in multiple places."
    avoid:
      - Do not invent local colors, radii, spacing, or button/card/select treatments when an approved token or primitive
        exists.
      - Do not expand the design system for one-off details that are unlikely to repeat.
    related:
      - docs/.vitepress/theme/components/DocsBreadcrumbs.vue
      - docs/.vitepress/theme/components/UiReferenceNav.vue
      - packages/ui/src/components/AnnotatedScreenshot.svelte
