name: Publish runtime image

on:
  push:
    tags:
      - 'v0.9.*'
      - 'v0.10.*'
      - 'v0.11.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Guildhall version to tag, for example 0.11.0'
        required: true
        default: '0.11.0'

permissions:
  contents: read
  packages: write

concurrency:
  group: runtime-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: matthew-dean/guildhall-runtime-debian
  RUNTIME_TAG_SUFFIX: trixie-node22-python313-playwright

jobs:
  runtime-image:
    name: Build and publish runtime image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve runtime image version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          minor="$(printf '%s\n' "$version" | awk -F. '{ print $1 "." $2 }')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Runtime image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-${{ env.RUNTIME_TAG_SUFFIX }}
            type=raw,value=${{ steps.version.outputs.minor }}-${{ env.RUNTIME_TAG_SUFFIX }}

      - name: Build and push runtime image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Containerfile
          push: true
          # Example 0.11.0 tags:
          # ghcr.io/matthew-dean/guildhall-runtime-debian:0.11.0-trixie-node22-python313-playwright
          # ghcr.io/matthew-dean/guildhall-runtime-debian:0.11-trixie-node22-python313-playwright
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
