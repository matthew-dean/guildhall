name: Build release artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to package'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-package:
    name: macOS packaged installer
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve runtime image digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="$(node -p "require('./package.json').version")"
          fi
          minor="$(printf '%s\n' "$version" | awk -F. '{ print $1 "." $2 }')"
          if [ "$(printf '%s\n' "$minor" | awk -F. '{ print ($1 > 0 || $2 >= 9) ? "yes" : "no" }')" = "no" ]; then
            echo "Runtime image digest is not required for Guildhall $version."
            exit 0
          fi
          digest="$(node scripts/resolve-runtime-image-digest.mjs "$version" --wait)"
          echo "GUILDHALL_RUNTIME_IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Resolved runtime image digest for Guildhall $version: $digest"

      - name: Verify release gates
        run: |
          pnpm typecheck
          pnpm docs:check-help-sync
          pnpm docs:build
          pnpm lint:deps
          pnpm test:release
          pnpm model:bakeoff

      - name: Build macOS package
        run: pnpm build:macos-package

      - name: Write checksum
        run: |
          cd artifacts/macos
          shasum -a 256 guildhall-macos.tar.gz > guildhall-macos.tar.gz.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: guildhall-macos
          path: |
            artifacts/macos/guildhall-macos.tar.gz
            artifacts/macos/guildhall-macos.tar.gz.sha256

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos/guildhall-macos.tar.gz
            artifacts/macos/guildhall-macos.tar.gz.sha256
          generate_release_notes: true
          make_latest: true
